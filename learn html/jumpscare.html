<!DOCTYPE html>
<html>
    <head>
        <title>Login into Your Account</title>
        <link rel="stylesheet" href="jumpscarestyle.css">
    </head>
    <body>
        <div class="box">
            <h1>Log In</h1>
            <form id="loginform">
                <div class="user">
                <label for="username">Username:</label>
                <input type="text" id="username"><br><br>
                </div>
                <div class="pass">
                <label for="password">Password:</label>
                <input type="password" id="password">
                </div>
            </form>
            <br>
            <a href="https://www.youtube.com/channel/UCkfZMWKeHStQaJyTnadNSMA">Forgot Password?</a>
            <button id="confirm">Confirm</button>
        </div>
    </body>
</html>
